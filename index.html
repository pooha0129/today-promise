<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d8b60">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="오늘의 약속">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>오늘의 약속</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">하루를 가볍게 채우는 플래너</p>
        <h1>오늘의 약속</h1>
        <p class="date" id="date"></p>
      </div>
      <div class="streak" aria-label="연속 3일">🔥 <span>3일째</span></div>
    </header>

    <section class="progress-card" aria-labelledby="progress-title">
      <div class="progress-head">
        <h2 id="progress-title">오늘의 작은 약속</h2>
        <strong id="count">0 / 0</strong>
      </div>
      <div class="track" id="progress" role="progressbar" aria-label="오늘 달성률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
      <p id="message" aria-live="polite">부담 없이, 하나씩 시작해요.</p>
    </section>

    <section aria-labelledby="task-heading">
      <div class="section-title"><h2 id="task-heading">할 일</h2><span id="remaining"></span></div>
      <ul id="tasks"></ul>
      <form id="form">
        <label class="sr-only" for="task-input">새 약속</label>
        <input id="task-input" type="text" maxlength="60" autocomplete="off" placeholder="새 약속을 적어보세요">
        <button type="submit">추가</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
